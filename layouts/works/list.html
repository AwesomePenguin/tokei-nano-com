{{ define "main" }}
  <div class="works-page">
    <header class="works-heading reveal">
      <p class="section-kicker">Tokei Nano</p>
      <h1>{{ .Title }}</h1>
      <p>{{ .Description }}</p>
    </header>
    <div class="work-grid">
      {{ range sort .RegularPages "Params.release_at" "desc" }}
        <a class="work-card reveal" href="{{ .RelPermalink }}">
          <div class="work-card-image">
            <img src="{{ printf "images/%s-960.jpg" .Params.cover_base | relURL }}" alt="{{ .Params.cover_alt }}" width="960" height="960" loading="lazy" decoding="async">
          </div>
          <h2>{{ .Title }}</h2>
          {{ with .Params.title_note }}<p class="work-title-note">{{ . }}</p>{{ end }}
          <p class="work-card-date">{{ .Params.release_date }}</p>
        </a>
      {{ end }}
    </div>
    <a class="work-back" href="{{ .Site.Home.RelPermalink }}">{{ .Params.home_label }} ↑</a>
  </div>
{{ end }}
